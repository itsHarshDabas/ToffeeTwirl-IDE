name: ToffeeTwirl - Linux

# Builds ToffeeTwirl IDE for Linux x64 from the VS Code commit in upstream/stable.json.
# Pull requests and master: build and keep the tarball as a workflow artifact.
# Run by hand with "publish" ticked: also publish it as a GitHub release, which GraceOS packages.

on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        description: Publish a GitHub release
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

permissions: {}

env:
  APP_NAME: ToffeeTwirl
  ASSETS_REPOSITORY: ${{ github.repository }}
  BINARY_NAME: twirl
  DISABLE_UPDATE: "yes"
  GH_REPO_PATH: ${{ github.repository }}
  ORG_NAME: GraceOS
  OS_NAME: linux
  VSCODE_ARCH: x64
  VSCODE_QUALITY: stable

jobs:
  grace-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Test the Grace extension
        run: node --test src/stable/extensions/grace/test/lib.test.js

  build:
    needs: grace-extension
    runs-on: ubuntu-22.04
    permissions:
      contents: write # only the publish step uses it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@e06c44b6df51fa631dbc917dfb0ebcc5cec0aa5b # v2.0.3
        with:
          version: 10
          platform: x64

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: sudo apt-get update -y && sudo apt-get install -y libkrb5-dev libxkbfile-dev libsecret-1-dev

      - name: Clone VS Code
        run: ./get_repo.sh

      - name: Build
        env:
          CI_BUILD: "no" # build.sh packs the Linux app in this job
          SHOULD_BUILD: "yes"
          SHOULD_BUILD_CLI: "no" # the tunnel CLI talks to Microsoft's tunnel service; GraceOS leaves it out
          SHOULD_BUILD_REH: "no"
          SHOULD_BUILD_REH_WEB: "no"
        run: ./build.sh

      - name: Check the build
        run: |
          app=VSCode-linux-x64
          test -x "$app/bin/twirl"
          test -d "$app/resources/app/extensions/grace"
          "$app/bin/twirl" --version
          jq -e '.nameLong == "ToffeeTwirl IDE" and .applicationName == "twirl"' "$app/resources/app/product.json"

      - name: Package
        run: |
          mkdir -p assets
          tarball="assets/ToffeeTwirl-linux-x64-${RELEASE_VERSION}.tar.gz"
          tar czf "$tarball" -C VSCode-linux-x64 .
          (cd assets && sha256sum "$(basename "$tarball")" > "$(basename "$tarball").sha256")
          cat assets/*.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ToffeeTwirl-linux-x64
          path: assets/
          retention-days: 7

      - name: Publish the release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "${RELEASE_VERSION}" assets/* --repo "${REPOSITORY}" \
            --title "ToffeeTwirl IDE ${RELEASE_VERSION}" \
            --notes "ToffeeTwirl IDE for Linux x64, built from VS Code ${MS_TAG} (${MS_COMMIT}) with VSCodium's patches. GraceOS packages this tarball."
